[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicon"
version = "0.1.0"
description = "Deterministic, replayable LLM workflows with first-class testing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Joe", email = "joe@example.com"},
]
dependencies = [
    "anthropic>=0.39.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
